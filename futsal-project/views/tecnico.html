<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Técnicos - Futsal Manager</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">⚽ Futsal Manager</div>
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/tecnico.html">Técnicos</a></li>
      <li><a href="/time.html">Times</a></li>
      <li><a href="/jogador.html">Jogadores</a></li>
      <li><a href="/competicao.html">Competições</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <h1>Gerenciamento de Técnicos</h1>

      <div class="alert" id="message"></div>

      <h2>Adicionar Novo Técnico</h2>
      <form id="formTecnico">
        <div class="form-group">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required>
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email">
        </div>
        <div class="form-group">
          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" name="telefone">
        </div>
        <div class="form-group">
          <label for="licenca">Licença CBV:</label>
          <input type="text" id="licenca" name="licenca">
        </div>
        <button type="submit" class="btn btn-success">Adicionar Técnico</button>
      </form>

      <h2>Lista de Técnicos</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Licença</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tecnicosList">
          <tr>
            <td colspan="6" style="text-align: center;">Carregando...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p><strong>Futsal Manager - Sistema de Gerenciamento</strong></p>
    <p>Aluno: <strong>João Felipe</strong> | DW1 - 3º Bimestre | Ano: 2026</p>
  </footer>

  <script>
    const API_URL = '/api/tecnicos';

    // Carregar técnicos ao abrir a página
    document.addEventListener('DOMContentLoaded', loadTecnicos);

    // Formulário de submissão
    document.getElementById('formTecnico').addEventListener('submit', handleSubmit);

    function loadTecnicos() {
      fetch(API_URL)
        .then(response => response.json())
        .then(data => {
          const tbody = document.getElementById('tecnicosList');
          tbody.innerHTML = '';

          if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Nenhum técnico cadastrado.</td></tr>';
            return;
          }

          data.forEach(tecnico => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${tecnico.id}</td>
              <td>${tecnico.nome}</td>
              <td>${tecnico.email || '-'}</td>
              <td>${tecnico.telefone || '-'}</td>
              <td>${tecnico.licenca || '-'}</td>
              <td>
                <div class="table-actions">
                  <button class="btn-edit" onclick="editTecnico(${tecnico.id})">Editar</button>
                  <button class="btn-delete" onclick="deleteTecnico(${tecnico.id})">Deletar</button>
                </div>
              </td>
            `;
            tbody.appendChild(row);
          });
        })
        .catch(error => showMessage('Erro ao carregar técnicos: ' + error, 'error'));
    }

    function handleSubmit(e) {
      e.preventDefault();

      const formData = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        telefone: document.getElementById('telefone').value,
        licenca: document.getElementById('licenca').value
      };

      fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      })
        .then(response => response.json())
        .then(data => {
          showMessage('Técnico adicionado com sucesso!', 'success');
          document.getElementById('formTecnico').reset();
          loadTecnicos();
        })
        .catch(error => showMessage('Erro ao adicionar técnico: ' + error, 'error'));
    }

    function editTecnico(id) {
      const nome = prompt('Novo nome do técnico:');
      if (!nome) return;

      const email = prompt('Novo email:');
      const telefone = prompt('Novo telefone:');
      const licenca = prompt('Nova licença:');

      const formData = {
        nome: nome,
        email: email,
        telefone: telefone,
        licenca: licenca
      };

      fetch(`${API_URL}/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      })
        .then(response => response.json())
        .then(data => {
          showMessage('Técnico atualizado com sucesso!', 'success');
          loadTecnicos();
        })
        .catch(error => showMessage('Erro ao atualizar técnico: ' + error, 'error'));
    }

    function deleteTecnico(id) {
      if (!confirm('Tem certeza que deseja deletar este técnico?')) return;

      fetch(`${API_URL}/${id}`, {
        method: 'DELETE'
      })
        .then(response => response.json())
        .then(data => {
          showMessage('Técnico deletado com sucesso!', 'success');
          loadTecnicos();
        })
        .catch(error => showMessage('Erro ao deletar técnico: ' + error, 'error'));
    }

    function showMessage(message, type) {
      const alertDiv = document.getElementById('message');
      alertDiv.textContent = message;
      alertDiv.className = `alert ${type} show`;
      setTimeout(() => {
        alertDiv.className = 'alert';
      }, 5000);
    }
  </script>
</body>
</html>
